version: '3.8'

services:
  # Consul Service Discovery
  consul:
    image: consul:1.15
    container_name: game-consul
    restart: unless-stopped
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_LOCAL_CONFIG={"server":true,"bootstrap_expect":1}
    networks:
      - game-network
    healthcheck:
      test: ["CMD", "consul", "kv", "put", "@test", "ok"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_MULTIPLE_DATABASES: game_auth, game_chat, game_analytics, game_leaderboard, game_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - game-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: game-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - game-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: game-api-gateway
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Consul__ConsulHost=consul
      - Consul__ConsulPort=8500
      - Consul__Host=api-gateway
      - Consul__Port=8080
      - GlobalConfiguration__ServiceDiscoveryProvider__Host=consul
      - GlobalConfiguration__ServiceDiscoveryProvider__Port=8500
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - game-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
    container_name: game-auth-service
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Consul__ServiceName=auth-service
      - Consul__Host=auth-service
      - Consul__Port=8080
      - Consul__ConsulHost=consul
      - Consul__ConsulPort=8500
      - Consul__HealthCheck__Endpoint=/health
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=game_auth;Username=postgres;Password=password
      - Jwt__Issuer=Game.AuthService
      - Jwt__Audience=Game.TinyMMO
      - Jwt__Key=development-key-for-jwt-signing-change-in-production
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - game-network

  # Game Service
  game-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.game
    container_name: game-game-service
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Consul__ServiceName=game-service
      - Consul__Host=game-service
      - Consul__Port=8080
      - Consul__ConsulHost=consul
      - Consul__ConsulPort=8500
      - Consul__HealthCheck__Endpoint=/health
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=game_inventory;Username=postgres;Password=password
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - game-network

  # Room Service
  room-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.room
    container_name: game-room-service
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Consul__ServiceName=room-service
      - Consul__Host=room-service
      - Consul__Port=8080
      - Consul__ConsulHost=consul
      - Consul__ConsulPort=8500
      - Consul__HealthCheck__Endpoint=/health
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - game-network

  # Chat Service
  chat-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.chat
    container_name: game-chat-service
    restart: unless-stopped
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Consul__ServiceName=chat-service
      - Consul__Host=chat-service
      - Consul__Port=8080
      - Consul__ConsulHost=consul
      - Consul__ConsulPort=8500
      - Consul__HealthCheck__Endpoint=/health
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=game_chat;Username=postgres;Password=password
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Issuer=Game.ChatService
      - Jwt__Audience=Game.TinyMMO
      - Jwt__Key=development-key-for-jwt-signing-change-in-production
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - game-network

  # (Optional) Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: game-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "14268:14268"   # HTTP collector
      - "16686:16686"   # Web UI
    networks:
      - game-network

  # (Optional) Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: game-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - game-network

  # (Optional) pgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: game-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@game.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - game-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  game-network:
    driver: bridge
