version: '3.8'

services:
  # Consul Service Discovery
  consul:
    image: consul:latest
    container_name: game-consul
    restart: unless-stopped
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    networks:
      - game-network
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_MULTIPLE_DATABASES: game_analytics, game_leaderboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - game-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: game-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - game-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chat Service
  chat-service:
    build:
      context: .
      dockerfile: Game.ChatService/Dockerfile
    container_name: game-chat-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8090
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=game_chat;Username=postgres;Password=password;
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Issuer=Game.ChatService
      - Jwt__Audience=Game.TinyMMO
      - Jwt__Key=development-key-for-jwt-signing-change-in-production
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - game-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # (Optional) Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: game-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "14268:14268"   # HTTP collector
      - "16686:16686"   # Web UI
    networks:
      - game-network

  # (Optional) Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: game-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - game-network

  # (Optional) pgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: game-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@game.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - game-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  game-network:
    driver: bridge