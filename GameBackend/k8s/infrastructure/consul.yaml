---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: consul-pvc
  namespace: game-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: game-backend
  labels:
    app: consul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
      - name: consul
        image: consul:1.15
        command:
        - consul
        - agent
        - -server
        - -ui
        - -bootstrap-expect=1
        - -client=0.0.0.0
        ports:
        - containerPort: 8500
          name: http
        - containerPort: 8600
          name: dns-tcp
          protocol: TCP
        - containerPort: 8600
          name: dns-udp
          protocol: UDP
        env:
        - name: CONSUL_BIND_INTERFACE
          value: eth0
        - name: CONSUL_LOCAL_CONFIG
          value: '{"server":true,"bootstrap_expect":1}'
        volumeMounts:
        - name: consul-data
          mountPath: /consul/data
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/agent/self
            port: 8500
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: consul-data
        persistentVolumeClaim:
          claimName: consul-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: game-backend
spec:
  selector:
    app: consul
  ports:
  - name: http
    port: 8500
    targetPort: 8500
  - name: dns-tcp
    port: 8600
    targetPort: 8600
    protocol: TCP
  - name: dns-udp
    port: 8600
    targetPort: 8600
    protocol: UDP
  type: ClusterIP
---
# 可选：如果需要从外部访问 Consul UI
apiVersion: v1
kind: Service
metadata:
  name: consul-ui
  namespace: game-backend
spec:
  selector:
    app: consul
  ports:
  - port: 8500
    targetPort: 8500
  type: LoadBalancer
