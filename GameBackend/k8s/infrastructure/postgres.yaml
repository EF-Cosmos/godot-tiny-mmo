---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: game-backend
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    
    # Create additional databases if needed
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE IF NOT EXISTS game_auth;
        CREATE DATABASE IF NOT EXISTS game_chat;
        CREATE DATABASE IF NOT EXISTS game_analytics;
        CREATE DATABASE IF NOT EXISTS game_leaderboard;
        
        GRANT ALL PRIVILEGES ON DATABASE game_auth TO $POSTGRES_USER;
        GRANT ALL PRIVILEGES ON DATABASE game_chat TO $POSTGRES_USER;
        GRANT ALL PRIVILEGES ON DATABASE game_analytics TO $POSTGRES_USER;
        GRANT ALL PRIVILEGES ON DATABASE game_leaderboard TO $POSTGRES_USER;
    EOSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: game-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: game-backend
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "game_db"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-script
        configMap:
          name: postgres-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: game-backend
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: game-backend
type: Opaque
stringData:
  password: "ChangeThisPasswordInProduction!"
