---
# Ingress 用于外部访问
# 注意：需要先安装 Ingress Controller（如 nginx-ingress）
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-backend-ingress
  namespace: game-backend
  annotations:
    # Nginx Ingress Controller 配置
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # CORS 配置
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    # 请求体大小限制
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # 超时配置
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  # TLS 配置（生产环境建议启用）
  # tls:
  # - hosts:
  #   - api.game.example.com
  #   secretName: game-tls-cert
  rules:
  # API Gateway
  - host: api.game.example.com  # 修改为你的域名
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-gateway-service
            port:
              number: 8080
  # 可选：直接访问 Consul UI（仅用于开发调试）
  # - host: consul.game.example.com
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: consul-ui
  #           port:
  #             number: 8500
---
# 创建 TLS Secret（如果需要 HTTPS）
# 注意：需要先有 TLS 证书文件
# kubectl create secret tls game-tls-cert \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   -n game-backend
