---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: game-backend
data:
  # Ocelot 配置 - 直接使用 K8s Service 名称，CoreDNS 自动解析
  ocelot.json: |
    {
      "Routes": [
        {
          "DownstreamPathTemplate": "/api/auth/{everything}",
          "DownstreamScheme": "http",
          "DownstreamHostAndPorts": [
            {
              "Host": "auth-service",
              "Port": 8080
            }
          ],
          "UpstreamPathTemplate": "/api/auth/{everything}",
          "UpstreamHttpMethod": ["GET", "POST", "PUT", "DELETE"]
        },
        {
          "DownstreamPathTemplate": "/api/game/{everything}",
          "DownstreamScheme": "http",
          "DownstreamHostAndPorts": [
            {
              "Host": "game-service",
              "Port": 8080
            }
          ],
          "UpstreamPathTemplate": "/api/game/{everything}",
          "UpstreamHttpMethod": ["GET", "POST", "PUT", "DELETE"]
        },
        {
          "DownstreamPathTemplate": "/api/room/{everything}",
          "DownstreamScheme": "http",
          "DownstreamHostAndPorts": [
            {
              "Host": "room-service",
              "Port": 8080
            }
          ],
          "UpstreamPathTemplate": "/api/room/{everything}",
          "UpstreamHttpMethod": ["GET", "POST", "PUT", "DELETE"]
        },
        {
          "DownstreamPathTemplate": "/api/chat/{everything}",
          "DownstreamScheme": "http",
          "DownstreamHostAndPorts": [
            {
              "Host": "chat-service",
              "Port": 8080
            }
          ],
          "UpstreamPathTemplate": "/api/chat/{everything}",
          "UpstreamHttpMethod": ["GET", "POST", "PUT", "DELETE"]
        }
      ],
      "GlobalConfiguration": {
        "BaseUrl": "http://api-gateway-service:8080",
        "ServiceDiscoveryProvider": {
          "Host": "consul",
          "Port": 8500,
          "Type": "Consul"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: game-backend
type: Opaque
stringData:
  # JWT 密钥
  jwt-key: "your-super-secret-jwt-key-change-in-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: game-backend
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: game-api-gateway:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        # Consul 配置 - 注册到 Consul
        - name: Consul__ServiceName
          value: "game-api-gateway"
        - name: Consul__Host
          value: "api-gateway"
        - name: Consul__Port
          value: "8080"
        - name: Consul__ConsulHost
          value: "consul"
        - name: Consul__ConsulPort
          value: "8500"
        - name: Consul__HealthCheck__Endpoint
          value: "/health"
        # JWT 配置
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: jwt-key
        # 挂载 Ocelot 配置
        volumeMounts:
        - name: ocelot-config
          mountPath: /app/ocelot.json
          subPath: ocelot.json
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: ocelot-config
        configMap:
          name: api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: game-backend
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
# HPA - 水平自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: game-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
