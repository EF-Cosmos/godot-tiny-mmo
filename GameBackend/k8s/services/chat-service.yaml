---
apiVersion: v1
kind: Secret
metadata:
  name: chat-service-secret
  namespace: game-backend
type: Opaque
stringData:
  # JWT 配置
  jwt-issuer: "Game.ChatService"
  jwt-audience: "Game.TinyMMO"
  jwt-key: "development-key-for-jwt-signing-change-in-production"
  # 数据库密码
  db-password: "ChangeThisPasswordInProduction!"
  # Redis 密码（如果需要）
  redis-password: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: game-backend
  labels:
    app: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: game-chat-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        # Consul 配置
        - name: Consul__ServiceName
          value: "chat-service"
        - name: Consul__Host
          value: "chat-service"
        - name: Consul__Port
          value: "8080"
        - name: Consul__ConsulHost
          value: "consul"
        - name: Consul__ConsulPort
          value: "8500"
        - name: Consul__HealthCheck__Endpoint
          value: "/health"
        # PostgreSQL 连接字符串
        - name: ConnectionStrings__PostgreSQL
          value: "Host=postgres-service;Database=game_chat;Username=postgres;Password=$(DB_PASSWORD)"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chat-service-secret
              key: db-password
        # Redis 连接字符串
        - name: ConnectionStrings__Redis
          value: "redis-service:6379"
        # JWT 配置
        - name: Jwt__Issuer
          valueFrom:
            secretKeyRef:
              name: chat-service-secret
              key: jwt-issuer
        - name: Jwt__Audience
          valueFrom:
            secretKeyRef:
              name: chat-service-secret
              key: jwt-audience
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: chat-service-secret
              key: jwt-key
        resources:
          requests:
            cpu: "300m"
            memory: "384Mi"
          limits:
            cpu: "600m"
            memory: "768Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: game-backend
spec:
  selector:
    app: chat-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-service-hpa
  namespace: game-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
