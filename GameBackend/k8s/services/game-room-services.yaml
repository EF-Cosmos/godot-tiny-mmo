---
apiVersion: v1
kind: Service
metadata:
  name: room-service
  namespace: game-backend
spec:
  selector:
    app: room-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
# Game Service HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-service-hpa
  namespace: game-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
# Room Service HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: room-service-hpa
  namespace: game-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: room-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
