    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: room-service
    spec:
      containers:
      - name: room-service
        image: game-room-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        # Consul 配置
        - name: Consul__ServiceName
          value: "room-service"
        - name: Consul__Host
          value: "room-service"
        - name: Consul__Port
          value: "8080"
        - name: Consul__ConsulHost
          value: "consul"
        - name: Consul__ConsulPort
          value: "8500"
        - name: Consul__HealthCheck__Endpoint
          value: "/health"
        # Redis 连接字符串
        - name: ConnectionStrings__Redis
          value: "redis-service:6379"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
