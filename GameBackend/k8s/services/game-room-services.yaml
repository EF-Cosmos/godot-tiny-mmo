---
# Game Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
  namespace: game-backend
  labels:
    app: game-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: game-service
    spec:
      containers:
      - name: game-service
        image: game-game-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        # Consul 配置
        - name: Consul__ServiceName
          value: "game-service"
        - name: Consul__Host
          value: "game-service"
        - name: Consul__Port
          value: "8080"
        - name: Consul__ConsulHost
          value: "consul"
        - name: Consul__ConsulPort
          value: "8500"
        - name: Consul__HealthCheck__Endpoint
          value: "/health"
        # Redis 连接字符串
        - name: ConnectionStrings__Redis
          value: "redis-service:6379"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: game-service
  namespace: game-backend
spec:
  selector:
    app: game-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
# Room Service
apiVersion: apps/v1
