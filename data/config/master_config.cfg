[gateway-manager-server]
port=8064
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"

[world-manager-server]
port=8062
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"

[chat-service]
enabled=true
address="127.0.0.1"
port=5004
protocol="http"
ws_endpoint="/chatHub"
jwt_key="development-key-for-jwt-signing-change-in-production"
