[world-server]
port=8090
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"
database_path="."
motd="Welcome to the Dark Dungeon!"
name="Dark Dungeon"
max_players=50

# Server identification for RoomService
map_name="Dungeon"
server_type="dungeon"
instance_id="dungeon-1"
region="default"

# Gameplay settings (automatically added as tags)
hardcore=true
bonus_xp=2.0
max_character=5
pvp=false

[world-manager-client]
address="127.0.0.1"
port=8062
certificate_path="res://data/config/tls/certificate.crt"

[game-service]
url="http://localhost:5002"

[chat-service]
enabled=true
address="127.0.0.1"
port=5004
ws_endpoint="/chatHub"
