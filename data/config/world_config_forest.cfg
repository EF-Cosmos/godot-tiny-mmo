[world-server]
port=8089
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"
database_path="."
motd="Welcome to the Forest Instance!"
name="Forest Instance 1"
max_players=100

# Server identification for RoomService
map_name="Forest"
server_type="instance"
instance_id="forest-1"
region="default"

# Gameplay settings (automatically added as tags)
hardcore=false
bonus_xp=1.0
max_character=5
pvp=false

[world-manager-client]
address="127.0.0.1"
port=8062
certificate_path="res://data/config/tls/certificate.crt"

[game-service]
url="http://localhost:5002"

[chat-service]
enabled=true
address="127.0.0.1"
port=5004
ws_endpoint="/chatHub"
