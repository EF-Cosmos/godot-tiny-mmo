<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Slide 8</title>
    <style>
        :root { --bg: #121212; --surface: #1E1E1E; --primary: #47E0A0; --text: #FFFFFF; --text-dim: #B0B0B0; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; width: 1280px; height: 720px; }
        .slide-container { padding: 60px 80px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
        h2 { font-size: 42px; margin: 0 0 50px 0; color: var(--text); border-left: 6px solid var(--primary); padding-left: 30px; }
        
        .stack-container { display: flex; gap: 60px; height: 100%; }
        .stack-block { flex: 1; }
        .stack-header { font-size: 32px; color: #fff; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .stack-list { display: grid; grid-template-columns: 1fr; gap: 20px; }
        
        .tech-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 15px 20px; border-radius: 6px; }
        .tech-label { color: var(--text-dim); font-size: 20px; }
        .tech-value { color: var(--primary); font-weight: bold; font-size: 20px; }
        .tech-value.dotnet { color: #5c9eff; }
    </style>
</head>
<body>
    <div class="slide-container">
        <h2>技术栈总结 (Tech Stack)</h2>
        
        <div class="stack-container">
            <div class="stack-block">
                <div class="stack-header" style="border-color: var(--primary)">Godot Engine</div>
                <div class="stack-list">
                    <div class="tech-item"><span class="tech-label">Engine Version</span><span class="tech-value">Godot 4.5</span></div>
                    <div class="tech-item"><span class="tech-label">Language</span><span class="tech-value">GDScript 2.0</span></div>
                    <div class="tech-item"><span class="tech-label">Network</span><span class="tech-value">WebSocket / ENet</span></div>
                    <div class="tech-item"><span class="tech-label">Serialization</span><span class="tech-value">PackedByteArray</span></div>
                    <div class="tech-item"><span class="tech-label">Platform</span><span class="tech-value">Linux (Headless)</span></div>
                </div>
            </div>
            
            <div class="stack-block">
                <div class="stack-header" style="border-color: #5c9eff">.NET Microservices</div>
                <div class="stack-list">
                    <div class="tech-item"><span class="tech-label">Framework</span><span class="tech-value dotnet">.NET 10.0</span></div>
                    <div class="tech-item"><span class="tech-label">API Gateway</span><span class="tech-value dotnet">Ocelot</span></div>
                    <div class="tech-item"><span class="tech-label">Service Discovery</span><span class="tech-value dotnet">Consul</span></div>
                    <div class="tech-item"><span class="tech-label">Realtime</span><span class="tech-value dotnet">SignalR Core</span></div>
                    <div class="tech-item"><span class="tech-label">Database</span><span class="tech-value dotnet">PostgreSQL + Redis</span></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
