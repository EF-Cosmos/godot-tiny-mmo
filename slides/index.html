<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot Tiny MMO - Architecture Presentation</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1E1E1E;
            --primary: #47E0A0;
            --accent: #5c9eff;
            --text: #FFFFFF;
            --text-dim: #B0B0B0;
            --surface-hover: #2A2A2A;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('godot-mmo-ppt/slides/images/background.jpg') center/cover;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid #2A2A2A;
            background: rgba(18, 18, 18, 0.95);
            z-index: 100;
        }

        .logo {
            width: 50px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .header h1 {
            font-size: 28px;
            margin: 0;
            color: var(--text);
            letter-spacing: -1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .header h1 span {
            color: var(--primary);
        }

        .subtitle {
            font-size: 14px;
            margin: 8px 0 0 0;
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 3px;
            background: #2A2A2A;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s ease;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Slides Container */
        .slides-wrapper {
            width: 100%;
            max-width: 1280px;
            height: 720px;
            position: relative;
            margin: 0 auto;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .slide.prev {
            transform: translateX(-100px);
        }

        /* Slide Content Styles */
        .slide-content {
            padding: 60px 80px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .slide-title {
            font-size: 48px;
            margin: 0 0 40px 0;
            color: var(--text);
            border-left: 6px solid var(--primary);
            padding-left: 30px;
        }

        /* Slide 1 - Cover */
        .slide-cover {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .slide-cover .cover-logo {
            width: 120px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .slide-cover h1 {
            font-size: 56px;
            margin: 0;
            color: var(--text);
            letter-spacing: -2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .slide-cover h1 span {
            color: var(--primary);
        }

        .slide-cover h2 {
            font-size: 28px;
            margin: 20px 0 50px 0;
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .cover-meta {
            display: flex;
            gap: 60px;
        }

        .meta-item {
            border-left: 2px solid var(--primary);
            padding-left: 20px;
            text-align: left;
        }

        .meta-title {
            color: var(--primary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .meta-desc {
            font-size: 18px;
            color: var(--text-dim);
        }

        /* Slide 2 - Background */
        .content-split {
            display: flex;
            gap: 60px;
            height: 100%;
        }

        .col-card {
            flex: 1;
            background: var(--surface);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .card-title {
            color: var(--primary);
            font-size: 22px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .card-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            margin-right: 12px;
            border-radius: 50%;
        }

        .card-text {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-dim);
        }

        .list-col {
            flex: 1;
        }

        .list-item {
            margin-bottom: 20px;
            font-size: 20px;
            color: var(--text-dim);
            padding-left: 30px;
            position: relative;
        }

        .list-item::before {
            content: '›';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
            font-size: 24px;
        }

        .highlight {
            color: var(--text);
            font-weight: 500;
        }

        /* Slide 3 - Architecture Diagram */
        .diagram-container {
            flex: 1;
            background: var(--surface);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
        }

        /* Slide 4 - Service Matrix */
        .service-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .service-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 6px;
            border-top: 3px solid var(--accent);
            transition: transform 0.2s;
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .service-name {
            color: var(--accent);
            font-weight: bold;
            font-size: 20px;
        }

        .service-port {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-family: monospace;
        }

        .service-desc {
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.5;
        }

        .infra-bar {
            background: #1a1a1a;
            padding: 18px;
            border-radius: 6px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid #333;
            margin-top: auto;
        }

        .infra-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .infra-icon {
            width: 32px;
            height: 32px;
            background: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: bold;
        }

        .infra-name {
            font-size: 14px;
            color: var(--text-dim);
        }

        /* Slide 5 - Game Servers */
        .server-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .server-item {
            background: var(--surface);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #333;
        }

        .server-item.active {
            border-left-color: var(--primary);
            background: #252525;
        }

        .server-name {
            color: var(--primary);
            font-size: 20px;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .server-port-tag {
            font-family: monospace;
            color: #888;
            font-size: 14px;
            background: #111;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .server-desc {
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.4;
        }

        /* Slide 6 - Code */
        .code-window {
            background: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .window-header {
            background: #252525;
            padding: 10px 15px;
            display: flex;
            gap: 6px;
            border-bottom: 1px solid #333;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .code-content {
            padding: 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 15px;
            line-height: 1.6;
            color: #d4d4d4;
        }

        .k { color: #569cd6; }
        .s { color: #ce9178; }
        .f { color: #dcdcaa; }
        .c { color: #6a9955; }
        .v { color: #9cdcfe; }

        .feature-title {
            color: var(--primary);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .feature-desc {
            color: var(--text-dim);
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Slide 7 - Features */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            height: 100%;
        }

        .col {
            background: var(--surface);
            padding: 25px;
            border-radius: 8px;
            border-top: 4px solid #333;
        }

        .col:nth-child(1) { border-top-color: var(--primary); }
        .col:nth-child(2) { border-top-color: var(--accent); }
        .col:nth-child(3) { border-top-color: #ffbd2e; }

        .col-title {
            font-size: 22px;
            color: #fff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .check-item {
            margin-bottom: 12px;
            color: var(--text-dim);
            font-size: 17px;
            display: flex;
            align-items: flex-start;
        }

        .check-item::before {
            content: '✓';
            color: var(--primary);
            margin-right: 10px;
            font-weight: bold;
        }

        .tag {
            display: inline-block;
            background: #333;
            color: #aaa;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        /* Slide 8 - Tech Stack */
        .tech-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .tech-label {
            color: var(--text-dim);
            font-size: 17px;
        }

        .tech-value {
            color: var(--primary);
            font-weight: bold;
            font-size: 17px;
        }

        .tech-value.dotnet {
            color: var(--accent);
        }

        .stack-header {
            font-size: 26px;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }

        /* Slide 9 - Deployment */
        .terminal {
            background: #000;
            border-radius: 8px;
            border: 1px solid #333;
            font-family: 'Consolas', monospace;
            padding: 20px;
            flex: 1;
        }

        .term-line {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
        }

        .prompt {
            color: var(--primary);
            margin-right: 12px;
            user-select: none;
        }

        .cmd {
            color: #fff;
        }

        .output {
            color: #888;
            font-size: 16px;
            margin-left: 20px;
            margin-bottom: 20px;
            display: block;
        }

        .access-info {
            margin-top: 25px;
            display: flex;
            gap: 25px;
        }

        .access-item {
            background: var(--surface);
            padding: 12px 20px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .access-label {
            color: var(--text-dim);
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }

        .access-url {
            color: var(--primary);
            font-family: monospace;
            font-size: 16px;
        }

        /* Navigation */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(18, 18, 18, 0.95);
            border-top: 1px solid #2A2A2A;
        }

        .nav-btn {
            background: var(--surface);
            border: 1px solid #333;
            color: var(--text);
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            border-color: #333;
        }

        .nav-info {
            text-align: center;
        }

        .nav-counter {
            font-size: 14px;
            color: var(--text-dim);
        }

        .nav-title {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        /* Thumbnails */
        .thumbnails {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .thumb {
            width: 40px;
            height: 30px;
            background: var(--surface);
            border: 2px solid #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-dim);
        }

        .thumb:hover {
            border-color: var(--text-dim);
        }

        .thumb.active {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--bg);
        }

        /* Loading indicator */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            font-size: 18px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .slide-content { padding: 40px; }
            .slide-title { font-size: 36px; }
            .service-matrix { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: 1fr; }
            .content-split { flex-direction: column; }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 20px; }
            .slide-content { padding: 20px; }
            .slide-title { font-size: 28px; }
            .service-matrix { grid-template-columns: 1fr; }
            .nav { padding: 15px 20px; }
            .thumbnails { display: none; }
        }

        /* Mermaid overrides */
        .mermaid {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script type="module">
        import mermaid from 'https://lib.baomitu.com/mermaid/10.9.0/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: false,  // Disabled - we'll run manually after content loads
            theme: 'dark',
            themeVariables: {
                primaryColor: '#1E1E1E',
                primaryTextColor: '#fff',
                primaryBorderColor: '#47E0A0',
                lineColor: '#47E0A0',
                secondaryColor: '#1E1E1E',
                tertiaryColor: '#1E1E1E'
            }
        });
        // Expose mermaid globally for use in loadSlideContent
        window.mermaid = mermaid;
    </script>
</head>
<body>
    <div class="bg-img"></div>

    <header class="header">
        <img src="godot-mmo-ppt/slides/images/logo.png" class="logo" alt="Godot Logo">
        <h1>Godot <span>Tiny MMO</span></h1>
        <div class="subtitle">微服务架构迁移策略与实践</div>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <main class="main">
        <div class="slides-wrapper">
            <!-- Slide 1: Cover -->
            <div class="slide active" data-src="content/slide1.html" data-title="封面" data-cover="true"></div>

            <!-- Slide 2: Background -->
            <div class="slide" data-src="content/slide2.html" data-title="背景与动机"></div>

            <!-- Slide 3: Architecture Overview -->
            <div class="slide" data-src="content/slide3.html" data-title="混合架构设计"></div>

            <!-- Slide 4: Service Matrix -->
            <div class="slide" data-src="content/slide4.html" data-title="微服务拆分"></div>

            <!-- Slide 5: Game Servers -->
            <div class="slide" data-src="content/slide5.html" data-title="游戏服务器层"></div>

            <!-- Slide 6: Core Tech -->
            <div class="slide" data-src="content/slide6.html" data-title="核心技术亮点"></div>

            <!-- Slide 7: Features -->
            <div class="slide" data-src="content/slide7.html" data-title="已实现功能"></div>

            <!-- Slide 8: Tech Stack -->
            <div class="slide" data-src="content/slide8.html" data-title="技术栈总结"></div>

            <!-- Slide 9: Deployment -->
            <div class="slide" data-src="content/slide9.html" data-title="开发与部署"></div>
        </div>
    </main>

    <nav class="nav">
        <button class="nav-btn" id="prevBtn" disabled>
            <span>←</span>
            <span>上一页</span>
        </button>

        <div class="nav-info">
            <div class="thumbnails" id="thumbnails"></div>
            <div class="nav-counter">
                <span id="currentSlide">1</span> / <span id="totalSlides">9</span>
            </div>
            <div class="nav-title" id="slideTitle">封面</div>
        </div>

        <button class="nav-btn" id="nextBtn">
            <span>下一页</span>
            <span>→</span>
        </button>
    </nav>

    <script>
        // Slide content loader
        async function loadSlideContent(slide) {
            const src = slide.dataset.src;
            if (!src || slide.dataset.loaded) return;

            try {
                const response = await fetch(src);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const content = await response.text();

                // Wrap content in slide-content div
                const isCover = slide.dataset.cover === 'true';
                const className = isCover ? 'slide-content slide-cover' : 'slide-content';
                slide.innerHTML = `<div class="${className}">${content}</div>`;
                slide.dataset.loaded = 'true';

                // Re-run Mermaid for this slide if it contains diagrams
                const mermaidContainer = slide.querySelector('.mermaid');
                if (mermaidContainer && window.mermaid) {
                    try {
                        await window.mermaid.run({
                            querySelector: `.slide[data-src="${src}"] .mermaid`
                        });
                    } catch (e) {
                        console.error('Mermaid render error:', e);
                    }
                }
            } catch (error) {
                console.error(`Failed to load ${src}:`, error);
                slide.innerHTML = `<div class="slide-content"><div class="loading">加载失败: ${error.message}</div></div>`;
            }
        }

        // Slide management
        class SlideManager {
            constructor() {
                this.slides = document.querySelectorAll('.slide');
                this.currentSlide = 0;
                this.totalSlides = this.slides.length;

                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.currentSlideEl = document.getElementById('currentSlide');
                this.totalSlidesEl = document.getElementById('totalSlides');
                this.slideTitleEl = document.getElementById('slideTitle');
                this.progressBar = document.getElementById('progressBar');
                this.thumbnailsContainer = document.getElementById('thumbnails');

                this.init();
            }

            async init() {
                // Update total slides
                this.totalSlidesEl.textContent = this.totalSlides;

                // Create thumbnails
                this.createThumbnails();

                // Load all slide contents
                await this.loadAllSlides();

                // Add event listeners
                this.prevBtn.addEventListener('click', () => this.prevSlide());
                this.nextBtn.addEventListener('click', () => this.nextSlide());

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') {
                        e.preventDefault();
                        this.nextSlide();
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        this.prevSlide();
                    } else if (e.key === 'Home') {
                        e.preventDefault();
                        this.goToSlide(0);
                    } else if (e.key === 'End') {
                        e.preventDefault();
                        this.goToSlide(this.totalSlides - 1);
                    }
                });

                // Touch/swipe support
                let touchStartX = 0;
                let touchEndX = 0;

                document.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                });

                document.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    this.handleSwipe(touchStartX, touchEndX);
                });

                // Initial update
                this.updateUI();
            }

            async loadAllSlides() {
                // Show loading state
                for (const slide of this.slides) {
                    if (!slide.dataset.loaded) {
                        slide.innerHTML = '<div class="slide-content"><div class="loading">加载中...</div></div>';
                    }
                }

                // Load all slides
                const promises = Array.from(this.slides).map(slide => loadSlideContent(slide));
                await Promise.all(promises);
            }

            handleSwipe(startX, endX) {
                const swipeThreshold = 50;
                if (endX < startX - swipeThreshold) {
                    this.nextSlide();
                } else if (endX > startX + swipeThreshold) {
                    this.prevSlide();
                }
            }

            createThumbnails() {
                for (let i = 0; i < this.totalSlides; i++) {
                    const thumb = document.createElement('div');
                    thumb.className = 'thumb' + (i === 0 ? ' active' : '');
                    thumb.textContent = i + 1;
                    thumb.addEventListener('click', () => this.goToSlide(i));
                    this.thumbnailsContainer.appendChild(thumb);
                }
            }

            goToSlide(index) {
                if (index < 0 || index >= this.totalSlides) return;

                // Remove active class from current slide
                this.slides[this.currentSlide].classList.remove('active');

                // Update current slide
                this.currentSlide = index;

                // Add active class to new slide
                this.slides[this.currentSlide].classList.add('active');

                // Update UI
                this.updateUI();
            }

            nextSlide() {
                if (this.currentSlide < this.totalSlides - 1) {
                    this.goToSlide(this.currentSlide + 1);
                }
            }

            prevSlide() {
                if (this.currentSlide > 0) {
                    this.goToSlide(this.currentSlide - 1);
                }
            }

            updateUI() {
                // Update counter
                this.currentSlideEl.textContent = this.currentSlide + 1;

                // Update title
                const slide = this.slides[this.currentSlide];
                this.slideTitleEl.textContent = slide.dataset.title || '';

                // Update progress bar
                const progress = ((this.currentSlide + 1) / this.totalSlides) * 100;
                this.progressBar.style.width = progress + '%';

                // Update buttons
                this.prevBtn.disabled = this.currentSlide === 0;
                this.nextBtn.disabled = this.currentSlide === this.totalSlides - 1;

                // Update thumbnails
                const thumbs = this.thumbnailsContainer.querySelectorAll('.thumb');
                thumbs.forEach((thumb, index) => {
                    thumb.classList.toggle('active', index === this.currentSlide);
                });
            }
        }

        // Initialize slide manager
        document.addEventListener('DOMContentLoaded', () => {
            new SlideManager();
        });
    </script>
</body>
</html>
