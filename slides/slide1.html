<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Slide 1</title>
    <style>
        :root { --bg: #121212; --surface: #1E1E1E; --primary: #47E0A0; --text: #FFFFFF; --text-dim: #B0B0B0; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; width: 1280px; height: 720px; }
        .slide-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('images/background.jpg') center/cover; opacity: 0.15; z-index: -1; }
        .logo { width: 150px; margin-bottom: 40px; opacity: 0.9; }
        h1 { font-size: 72px; margin: 0; color: var(--text); letter-spacing: -2px; text-transform: uppercase; font-weight: 700; }
        h1 span { color: var(--primary); }
        h2 { font-size: 32px; margin: 20px 0 60px 0; color: var(--text-dim); font-weight: 300; letter-spacing: 2px; }
        .meta { display: flex; gap: 60px; text-align: left; }
        .meta-item { border-left: 2px solid var(--primary); padding-left: 20px; }
        .meta-title { color: var(--primary); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .meta-desc { font-size: 18px; color: var(--text-dim); max-width: 300px; }
        .footer { position: absolute; bottom: 40px; font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-img"></div>
        <img src="images/logo.png" class="logo" alt="Godot Logo">
        <h1>Godot <span>Tiny MMO</span></h1>
        <h2>微服务架构迁移策略与实践</h2>
        
        <div class="meta">
            <div class="meta-item">
                <div class="meta-title">Framework</div>
                <div class="meta-desc">Godot 4.5 + .NET 10.0</div>
            </div>
            <div class="meta-item">
                <div class="meta-title">Architecture</div>
                <div class="meta-desc">Docker Microservices + Headless</div>
            </div>
        </div>
        
        <div class="footer">Godot Tiny MMO Architecture Presentation</div>
    </div>
</body>
</html>
