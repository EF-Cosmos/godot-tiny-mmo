<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Slide 7</title>
    <style>
        :root { --bg: #121212; --surface: #1E1E1E; --primary: #47E0A0; --text: #FFFFFF; --text-dim: #B0B0B0; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; width: 1280px; height: 720px; }
        .slide-container { padding: 60px 80px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
        h2 { font-size: 42px; margin: 0 0 50px 0; color: var(--text); border-left: 6px solid var(--primary); padding-left: 30px; }
        
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; height: 100%; }
        .col { background: var(--surface); padding: 30px; border-radius: 8px; border-top: 4px solid #333; position: relative; }
        .col:nth-child(1) { border-top-color: var(--primary); }
        .col:nth-child(2) { border-top-color: #5c9eff; }
        .col:nth-child(3) { border-top-color: #ffbd2e; }
        
        .col-title { font-size: 26px; color: #fff; margin-bottom: 25px; font-weight: bold; }
        .list-item { margin-bottom: 15px; color: var(--text-dim); font-size: 20px; display: flex; align-items: flex-start; }
        .list-item::before { content: '✓'; color: var(--primary); margin-right: 12px; font-weight: bold; }
        
        .tag { display: inline-block; background: #333; color: #aaa; font-size: 12px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="slide-container">
        <h2>已实现功能 (Implemented Features)</h2>
        
        <div class="grid-3">
            <div class="col">
                <div class="col-title">核心系统</div>
                <div class="list-item">客户端-服务器连接 <span class="tag">ENet</span></div>
                <div class="list-item">三服务器网络架构</div>
                <div class="list-item">账户注册与登录 <span class="tag">JWT</span></div>
                <div class="list-item">角色创建与选择</div>
                <div class="list-item">数据持久化 <span class="tag">Postgres</span></div>
            </div>
            
            <div class="col">
                <div class="col-title">游戏玩法</div>
                <div class="list-item">基础战斗系统</div>
                <div class="list-item">多地图实例切换</div>
                <div class="list-item">实体状态同步 <span class="tag">Sync</span></div>
                <div class="list-item">背包物品系统</div>
                <div class="list-item">装备穿戴逻辑</div>
            </div>
            
            <div class="col">
                <div class="col-title">微服务 & 社交</div>
                <div class="list-item">API Gateway 路由</div>
                <div class="list-item">Auth Service 鉴权</div>
                <div class="list-item">Chat Service 聊天</div>
                <div class="list-item">公会系统基础</div>
                <div class="list-item">Jaeger 链路追踪</div>
            </div>
        </div>
    </div>
</body>
</html>
